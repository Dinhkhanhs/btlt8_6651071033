<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Thêm và xóa hàng trong Table</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
</head>

<body style="border:1px solid grey">

    <h2>Quản lý thông tin user</h2>

    <form id="userForm">
        <input type="text" id="name" placeholder="Name">
        <input type="text" id="email" placeholder="Email Address">
        <input type="text" id="datepicker" placeholder="Birthdate">
        <input type="button" class="add-row" value="Add Row">
    </form>

    <table>
        <thead>
            <tr>
                <th>Select</th>
                <th>Name</th>
                <th>Email</th>
                <th>Birthdate</th>
            </tr>
        </thead>

        <tbody>
        </tbody>
    </table>

    <button type="button" class="delete-row">Delete Row</button>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>

    <script>
        $(document).ready(function () {
            $('#datepicker').datepicker({
                dateFormat: 'dd/mm/yy',
                changeMonth: true,
                changeYear: true
            });

            $('.add-row').click(function () {
                var name = $('#name').val().trim();
                var email = $('#email').val().trim();
                var birthdate = $('#datepicker').val().trim();

                var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (name === '' || email === '' || birthdate === '') {
                    alert('Vui lòng nhập đầy đủ thông tin!');
                    return;
                }

                if (!emailPattern.test(email)) {
                    alert('Email không đúng định dạng!');
                    return;
                }

                var row = '<tr>' +
                    '<td><input type="checkbox" class="select-row"></td>' +
                    '<td>' + $('<div>').text(name).html() + '</td>' +
                    '<td>' + $('<div>').text(email).html() + '</td>' +
                    '<td>' + $('<div>').text(birthdate).html() + '</td>' +
                    '</tr>';

                $('table tbody').append(row);

                $('#name').val('');
                $('#email').val('');
                $('#datepicker').val('');
            });

            $('.delete-row').click(function () {
                var selected = $('table tbody .select-row:checked');

                if (selected.length === 0) {
                    alert('Vui lòng chọn hàng cần xóa!');
                    return;
                }

                selected.closest('tr').remove();
            });
        });
    </script>

</body>

</html>
