<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>D CODE SHOW</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h4>Checkbox Div Hide Show</h4>

    <div class="checkbox-card">
        <label>Do You have Passport</label>
        <div class="checkbox">
            <label>
                <input type="checkbox" class="checkme">Yes
            </label>
        </div>
        <div class="passport-box">
            <input type="text" placeholder="Enter Passport Number" class="form-control">
        </div>
        <div class="apply-box">
            <a href="">Apply For Passport</a>
        </div>
    </div>

    <br>

    <div class="checkbox-card">
        <label>Do You have Credit Card</label>
        <div class="checkbox">
            <label>
                <input type="checkbox" class="checkme">Yes
            </label>
        </div>
        <div class="passport-box">
            <input type="text" placeholder="Enter Credit Card Number" class="form-control">
        </div>
        <div class="apply-box">
            <a href="">Apply For Credit Card</a>
        </div>
    </div>

    <script src="jquery-latest.min.js"></script>
    <script>
        document.querySelectorAll('.checkme').forEach(function (checkbox) {
            checkbox.addEventListener('change', function () {
                var card = this.closest('.checkbox-card');
                var textbox = card.querySelector('.passport-box');

                if (this.checked) {
                    textbox.style.display = 'block';
                } else {
                    textbox.style.display = 'none';
                }
            });
        });
    </script>

</body>

</html>
